version: '3.8'

services:
  factchecker:
    build: .
    ports:
      - "8000:8000"
    environment:
      - FACTCHECK_ENABLE_CROSSENCODER=0
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
