name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('app/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r app/requirements.txt
        pip install pytest black flake8 mypy
    
    - name: Check code formatting with black
      run: |
        black --check app/ scripts/ || echo "⚠️ Code formatting issues found"
      continue-on-error: true
    
    - name: Lint with flake8
      run: |
        flake8 app/ scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics || echo "⚠️ Linting issues found"
      continue-on-error: true
    
    - name: Type check with mypy
      run: |
        mypy app/ --ignore-missing-imports || echo "⚠️ Type checking issues found"
      continue-on-error: true
    
    - name: Run smoke test (optional)
      run: |
        python -c "
        import asyncio
        import sys
        from app.pipeline.factchecker import FactChecker
        
        async def test():
            try:
                fc = FactChecker()
                await fc.start()
                result = await fc.check('Berlin ist die Hauptstadt von Deutschland', max_pages=1)
                assert result.get('label') in ['SUPPORTED', 'REFUTED', 'NOT_ENOUGH_INFO'], f'Unexpected label: {result.get(\"label\")}'
                print('✓ Smoke test passed')
                await fc.close()
            except Exception as e:
                print(f'⚠️ Smoke test failed: {e}', file=sys.stderr)
                sys.exit(0)  # Don't fail CI on smoke test
        
        asyncio.run(test())
        " || echo "⚠️ Smoke test skipped (non-critical)"
      continue-on-error: true
      timeout-minutes: 3
