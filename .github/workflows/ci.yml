name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('app/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r app/requirements.txt
        pip install pytest black flake8 mypy
    
    - name: Check code formatting with black
      run: |
        black --check app/ scripts/
    
    - name: Lint with flake8
      run: |
        flake8 app/ scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 app/ scripts/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Type check with mypy
      run: |
        mypy app/ --ignore-missing-imports || true
    
    - name: Run smoke test
      run: |
        python -c "
        import asyncio
        from app.pipeline.factchecker import FactChecker
        
        async def test():
            fc = FactChecker()
            await fc.start()
            result = await fc.check('Berlin ist die Hauptstadt von Deutschland', max_pages=1)
            assert result.get('label') in ['SUPPORTED', 'REFUTED', 'NOT_ENOUGH_INFO']
            await fc.close()
        
        asyncio.run(test())
        "
      timeout-minutes: 5
